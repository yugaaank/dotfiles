# Snappy Switcher Configuration

[general]
# View mode: overview (simple) or context (grouped by workspace + app)
mode = context
# Follow active monitor focus
follow_monitor = true
# Show workspace badge on window cards
show_workspace_badge = true
# true keeps focus on current window, false selects previous window on launch
sticky_mode = false
# Key modifier to dismiss the switcher on release
dismiss_modifier = alt

[theme]
# Theme file loaded from ~/.config/snappy-switcher/themes/
name = noctalia.ini
border_width = 2
corner_radius = 15

[layout]
# Card grid layout dimensions and padding
card_width = 145
card_height = 135
card_gap = 10
padding = 10
max_cols = 5
icon_size = 57
icon_radius = 15

[icons]
# Icon themes and fallbacks
theme = Adwaita
fallback = hicolor
show_letter_fallback = true

[font]
# Typography settings
family = Inter
weight = Bold
title_size = 10
icon_letter_size = 24
