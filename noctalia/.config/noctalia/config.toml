[osd]
offset_x = 40
offset_y = 80
position = "bottom_center"
position_vertical = "bottom_center"

[plugin_settings."cleboost/hotspot"]
password = "nahbronah"

[plugin_settings."joshuaslate/shelly"]
notify = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Pictures/Wallpapers"

[plugin_settings."whyoolw/dropwall"]
copy_to_wallpaper_dir = true

[plugins]
enabled = [
    "noctalia/mpvpaper",
    "icefish/phone-connect",
    "yugaaank/better-clock",
    "yugaaank/better-calendar",
    "yugaaank/media-player",
    "yugaaank/todo-widget"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    enabled = false
    kind = "path"
    location = "/home/yugaaank/community-plugins"
    name = "dev"

[shell]
app_icon_color = "hover"
avatar_path = "/home/yugaaank/Pictures/desktop/f084db2a724fed85b209fd0e87f32081-removebg-preview.png"
button_borders = false
corner_radius_scale = 0.0
font_family = "SF Pro Display"
password_style = "random"
polkit_agent = true

    [shell.launcher]
    categories = false
    sort_by_usage = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

    [shell.shadow]
    alpha = 0.99999997764825821
    direction = "center"

[theme]
community_palette = "Shinonome"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "starship" ]
    community_ids = [ "opencode", "zen-browser", "neovim", "vscode", "zed", "snappy-switcher" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/yugaaank/Pictures/Wallpapers/wallhaven-9dqwqk.jpg"

    [wallpaper.last]
    path = "/home/yugaaank/Pictures/Wallpapers/wallhaven-9dqwqk.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/yugaaank/Pictures/Wallpapers/wallhaven-9dqwqk.jpg"

[widget.active_window]
capsule_border = "hover"
capsule_padding = 7
capsule_radius = 8
title_scroll = "on_hover"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
capsule_fill = "primary"
capsule_foreground = "on_primary"
capsule_padding = 10
capsule_radius = "auto"
font_weight = 500
format = "{:%H:%M   %d %b %a} "

[widget.control-center]
glyph = "navigation-filled"
scale = 1.3

[widget.cpu]
show_label = false

[widget.keyboard_layout]
show_glyph = false

[widget.launcher]
scale = 1.3

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.ram]
show_label = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
capsule = true
capsule_fill = "primary"
capsule_foreground = "on_primary"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
length = 15
type = "spacer"

[widget.taskbar]
pinned = [ "org.gnome.Nautilus", "kitty", "zen", "zed", "camera", "calculator", "btop", "vesktop" ]
pinned_opacity = 1.0
scale = 1.9000000000000001
show_active_indicator = false
show_workspace_label = false

[widget.temp]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
