    center = [ "taskbar" ]
    enabled = false
    margin_ends = 0
    position = "bottom"
    thickness = 50

    [bar.default]
    center = [ "clock", "recorder" ]
    end = [
        "tray",
        "spacer_2",
        "bar",
        "spacer_3",
        "keyboard_layout",
        "spacer_3",
        "network",
        "spacer_3",
        "bluetooth",
        "spacer_3",
        "volume",
        "spacer_3",
        "battery",
        "spacer_3",
        "session"
